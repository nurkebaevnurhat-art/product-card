<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="modal.css">
</head>
<body>
  <main class="catalog">
    <div class="container">
      <h1 class="title catalog__title">Выбери свой продукт</h1> 
      <button id="change-color-all-cards">Изменить цвет всех карточек</button>
      <button id="change-color-first-card">Изменить цвет первой карточки</button>
      <button id="open-google">открыть страницу Google</button>
      <button id="output-console-log">вывести сообщение в консоль лог</button>
      <button id="toggle-color-button">Переключить цвет кнопки</button>
       <ul id="product-cards"></ul>
        <template id="product-card-template">
          <li class="card">
            <img class="card__image" src="" alt="" width="290" height="245"/>
            <span class="card__category"></span>
            <h2 class="card__title"></h2>
            <p class="card__description"></p>
            <div class="card__compound compound">
              <span class="compound__name"> Состав: </span>
              <ul class="compound__list"></ul>
            </div>
            <div class="card__price_block">
               <p class="card__price">Цена:</p>
               <p class="card__value"></p>
          </div>
          </li>
        </template>
    </div>
        <footer>
          <section class="footer__section">
              <div class="footer_info">
                <p class="footer__name"> Product Cards </p>
                <p class="footer__description"> У нас самые лучшие продукты для кожи ! </p>
                <div class="socials">
                  <a href="#"> <img class="socials__icon" src="images/telegram.svg"> </a>
                  <a href="#"> <img class="socials__icon" src="images/vk.svg"> </a>
                </div>
              </div>
                <div class="footer__subscribe">
                  <p class="footer__subscribe-text"> Подпишитесь на наши акции: </p>
                  <form class="footer__subscribe-form">
                    <input id="email" type="email" placeholder="Введите ваш email">
                    <button type="submit" class="footer__subscribe-button">Подписаться</button>
                    <p class="footer__error-massage"></p>
                  </form>
                </div>
                <nav class="footer_nav">
                  <p class="footer__links-title"> Быстрые ссылки </p>
                    <a class="footer__link" href="#">Главная</a>
                    <a class="footer__link" href="#">Магазин</a>
                    <a class="footer__link" href="#">Контакты</a>
                </nav>
          </section>
          <p class="footer__copyright"> 2024 product cards.com © All rights reserved.</p>
        </footer> 
        <button class="open_registration">Регистрация</button>
          <div class="overlay"></div>
          <div class="modal">
            <button class="modal_close">×</button>
              <h2 class ="registration_title"> создание аккаунта </h2>
              <form class="registration_form">
                  <label> Имя <input type="text" name="firstName" placeholder="Введите имя" required> </label>
                  <label> Фамилия <input type="text" name="lastName" placeholder="Введите фамилию" required> </label>
                  <label> Дата рождения <input type="date" name="birthDate" required> </label>
                  <label> Логин <input type="text" name="login" placeholder="Введите логин" required> </label>
                  <label> Пароль <input type="password" name="password" placeholder="Введите пароль" required> </label>
                  <label> Повторите пароль <input type="password" name="repeatPassword" placeholder="Повторите пароль" required > </label>
                  <button type="submit"> Зарегистрироваться </button>
              </form>
          </div>
  </main>
  <script src="main.js"></script> 
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>  
  <script type="module" src="homework-10.js"></script>
  <script type="module" src="./homework-11.js"></script>
</body> 
</html>
