<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style/clear-list.css">
</head>
<body>
  <main class="catalog">
    <div class="container">
      <h1 class="title catalog__title">Выбери свой продукт</h1> 
      <button id="change-color-all-cards">Изменить цвет всех карточек</button>
      <button id="change-color-first-card">Изменить цвет первой карточки</button>
      <button id="open-google">открыть страницу Google</button>
      <button id="output-console-log">вывести сообщение в консоль лог</button>
      <button id="toggle-color-button">Переключить цвет кнопки</button>
       <ul id="product-cards"></ul>
        <template id="product-card-template">
          <li class="card">
            <img class="card__image" src="" alt="" width="290" height="245"/>
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>
            <div class="card__compound compound">
              <span class="compound__name"> состав: </span>
              <ul class="compound__list"></ul>
            </div>
            <div class="card__price-block">
                <b class="card__price"> цена: </b>
                <p class="card__value"> </p>
            </div>
          </li>
        </template>
    </div>
  </main>
  <script src="main.js"></script> 
  <script src="homework-7.js"></script> 
  <script src="homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>  
  <script type="module" src="homework-10.js"></script>
</body> 
</html>
